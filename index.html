<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>依期一會｜塔羅日記</title>
<meta name="theme-color" content="#f6f2ea">
<meta name="description" content="以牌為鏡，與每個當下的自己相遇。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="依期一會">
<meta property="og:title" content="依期一會｜塔羅日記">
<meta property="og:description" content="以牌為鏡，與每個當下的自己相遇。">
<meta property="og:url" content="https://yamap610.github.io/tarot-diary/">
<meta property="og:image" content="https://yamap610.github.io/tarot-diary/icons/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="依期一會">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --paper:#fffdf8; --ink:#3c4a3e; --sub:#8a8478; --gold:#a8905e;
  --blue:#93a7b8; --blue-d:#6f8598; --milk:#e6d8c4; --line:#e8e0d2; --rose:#c9a49a;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
textarea{font:inherit;color:var(--ink)}
#app{max-width:480px;margin:0 auto;padding:22px 18px calc(96px + env(safe-area-inset-bottom))}
.tab{display:none}.tab.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* header */
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:600}
.h1{font-family:var(--serif);font-weight:700;font-size:28px;margin:4px 0 2px;letter-spacing:.04em}
.meta{font-size:13px;color:var(--sub);letter-spacing:.05em}
.h2{font-family:var(--serif);font-weight:700;font-size:18px;margin:0 0 10px}

/* card stage */
.stage{perspective:1400px;width:min(64vw,280px);aspect-ratio:var(--ar,2/3);margin:26px auto 18px}
.flipper{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.45,.1,.2,1)}
.flipper.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden;box-shadow:0 10px 28px rgba(80,70,50,.18)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.front{transform:rotateY(180deg)}
.back{background:
  radial-gradient(circle at 50% 50%,rgba(255,253,248,.35) 0 18%,transparent 19%),
  repeating-radial-gradient(circle at 50% 50%,transparent 0 10px,rgba(255,253,248,.13) 10px 11px),
  linear-gradient(160deg,var(--back1,#9fb2c2),var(--back2,#7f95a8));
  display:flex;align-items:center;justify-content:center}
.back::before{content:"";position:absolute;inset:10px;border:1.5px solid rgba(255,253,248,.7);border-radius:9px}
.back::after{content:"☾ ✦ ☽";position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fffdf8;letter-spacing:.3em;font-size:13px;opacity:.85}
.back .sym{font-size:46px;color:#fffdf8;text-shadow:0 0 18px rgba(255,255,255,.6)}
body.art-back .back{background:#f6efe2 var(--backimg) center/cover}
body.art-back .back::before,body.art-back .back::after,body.art-back .back .sym{display:none}
.banner{display:flex;align-items:center;gap:10px;background:#fbf3e4;border:1px solid #ecdcbf;border-radius:14px;padding:10px 14px;margin:0 0 14px;font-size:13px}
.banner span{flex:1}
.decks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.dk{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--sub);padding:8px 4px;border-radius:12px;border:1.5px solid transparent;text-align:center;line-height:1.4}
.dk.on{border-color:var(--gold);background:#fbf5ea;color:var(--ink);font-weight:600}
.dk img,.dk .soon{width:56px;height:90px;object-fit:cover;border-radius:6px;box-shadow:0 2px 6px rgba(80,70,50,.18)}
.dk .soon{display:flex;align-items:center;justify-content:center;background:var(--line);font-size:22px;box-shadow:none}
.dk:disabled{opacity:.6}
.idle{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-7px) rotate(.6deg)}}
.hint{text-align:center;color:var(--sub);font-size:14px}
.card-img{display:block;width:min(64vw,280px);aspect-ratio:var(--ar,2/3);object-fit:cover;margin:24px auto 14px;border-radius:14px;box-shadow:0 10px 28px rgba(80,70,50,.18);cursor:zoom-in}

.cname{text-align:center;font-family:var(--serif);font-weight:700;font-size:22px;margin:0}
.cen{text-align:center;color:var(--sub);font-size:13px;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 4px}
.chip{background:var(--paper);border:1px solid var(--line);color:var(--gold);font-size:12px;padding:2px 10px;border-radius:20px}

.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:14px}
.box .lbl{font-size:12px;color:var(--gold);letter-spacing:.12em;font-weight:600;margin-bottom:4px}
.box p{margin:0}
.letter{font-family:var(--serif);font-size:16px;line-height:1.9}

.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px 10px;border-radius:14px;background:var(--ink);color:#fffdf8;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.line{background:#06c755}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.small{flex:none;padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.5}

textarea.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;resize:vertical;min-height:70px;outline:none}
textarea.in:focus{border-color:var(--milk)}
.moods{display:flex;gap:6px;margin:6px 0 10px}
.mood{flex:1;font-size:22px;padding:6px 0;border-radius:12px;border:1px solid var(--line);background:#fff;filter:grayscale(.6);opacity:.65}
.mood.on{filter:none;opacity:1;border-color:var(--gold);background:#fbf5ea}
.stars{display:flex;gap:4px;align-items:center;margin:4px 0}
.star{font-size:26px;color:var(--line);padding:0 2px}
.star.on{color:var(--gold)}
.fitlbl{font-size:13px;color:var(--sub);margin-left:6px}
.sublbl{font-size:13px;color:var(--sub);margin:12px 0 2px}
.saved{font-size:12px;color:var(--sub);text-align:right;margin-top:6px}

.lastyear{display:flex;gap:12px;align-items:center;cursor:pointer}
.lastyear img{width:48px;border-radius:6px}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.calhead button{font-size:20px;padding:4px 12px;color:var(--sub)}
.calhead .mon{font-family:var(--serif);font-weight:700;font-size:18px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:12px;color:var(--sub)}
.cell{aspect-ratio:2/3;border-radius:8px;background:var(--paper);border:1px solid var(--line);position:relative;overflow:hidden;font-size:12px;color:var(--sub);padding:2px 4px}
.cell.empty{background:none;border:none}
.cell.has{border:none;padding:0;cursor:pointer}
.cell.has img{width:100%;height:100%;object-fit:cover;display:block}
.cell.has .d{position:absolute;top:3px;left:3px;background:rgba(255,253,248,.9);border-radius:6px;padding:0 4px;font-size:11px;color:var(--ink);line-height:1.5}
.cell.has .dot{position:absolute;bottom:3px;right:3px;font-size:11px;background:rgba(255,253,248,.9);border-radius:6px;padding:0 3px}
.cell.today{outline:2px solid var(--gold);outline-offset:1px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:20px}
.stat span{font-size:12px;color:var(--sub)}

/* deck */
.filters{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.filters button{flex:none;font-size:13px;padding:5px 12px;border-radius:20px;background:var(--paper);border:1px solid var(--line);color:var(--sub)}
.filters button.on{background:var(--ink);color:#fffdf8;border-color:var(--ink)}
.deckgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dc{position:relative;cursor:pointer}
.dc img{width:100%;aspect-ratio:var(--ar,2/3);object-fit:cover;border-radius:7px;display:block;filter:grayscale(1);opacity:.38;transition:.3s}
.dc.got img{filter:none;opacity:1;box-shadow:0 3px 8px rgba(80,70,50,.15)}
.dc .n{position:absolute;top:3px;right:3px;background:var(--gold);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;line-height:1.6}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.bar .t{width:96px;color:var(--sub);white-space:nowrap}
.bar .track{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--blue);border-radius:6px}
.bar .v{width:28px;text-align:right;color:var(--sub)}

/* settings */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:none}
.row small{display:block;color:var(--sub);font-size:12px;line-height:1.5}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav div{display:flex;max-width:480px;width:100%}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);gap:1px;margin:0 6px;padding:5px 0 3px;border-radius:14px;transition:.2s}
.nav button .i{display:flex;height:26px;align-items:center;color:#a59e92;transition:.2s}
.nav button .i svg{width:24px;height:24px}
.nav button.on{color:var(--ink);font-weight:700;background:#efe5d3}
.nav button.on .i{color:var(--gold)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(50,45,35,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden,.zoom.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .close{float:right;font-size:22px;color:var(--sub);padding:0 6px}
.sheet .card-img{width:min(48vw,200px);margin:14px auto 10px}
.share-preview{width:100%;border-radius:12px;margin:10px 0;box-shadow:0 6px 18px rgba(80,70,50,.15)}
.zoom{position:fixed;inset:0;background:rgba(30,28,24,.88);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.zoom img{max-width:100%;max-height:100%;border-radius:14px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fffdf8;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
.backs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.bk{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--sub);padding:6px 0;border-radius:12px;border:1.5px solid transparent}
.bk.on{border-color:var(--gold);background:#fbf5ea;color:var(--ink);font-weight:600}
.bk i{display:block;width:44px;aspect-ratio:2/3;border-radius:6px;position:relative;box-shadow:0 2px 6px rgba(80,70,50,.18)}
.bk i.art::before,.bk i.art::after{display:none}
.bk i::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fffdf8;font-style:normal;font-size:14px}
.bk i::before{content:"";position:absolute;inset:3px;border:1px solid rgba(255,253,248,.7);border-radius:4px}
.endnote{text-align:center;font-family:var(--serif);font-size:12px;color:var(--sub);opacity:.6;margin:26px 0 4px;letter-spacing:.05em}
.dview{background:#fbf7ef;border-radius:12px;padding:12px 14px;margin-top:6px}
.dmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dmood{font-size:26px;line-height:1}
.dstars{color:var(--gold);letter-spacing:2px;font-size:17px}.dstars i{color:var(--line);font-style:normal}
.dtext{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;line-height:1.8}
.dempty{color:var(--sub);font-size:14px;margin:6px 0 0}
.in1{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font:inherit;color:var(--ink);outline:none;margin-top:8px;font-size:16px}
.in1:focus{border-color:var(--milk)}
.countdown{text-align:center;font-size:13px;color:var(--sub);margin:14px 0 -8px}
.countdown b{color:var(--gold);font-weight:600}
.decktabs{display:flex;gap:6px;margin:12px 0 4px}
.decktabs button{flex:1;padding:8px 4px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:13px;color:var(--sub);line-height:1.4}
.decktabs button small{display:block;font-size:11px;opacity:.8}
.decktabs button.on{background:var(--ink);color:#fffdf8;border-color:var(--ink)}
.datelist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.datelist button{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--paper);border:1px solid var(--line)}
</style>
</head>
<body>
<main id="app">
  <section id="tab-today" class="tab active"></section>
  <section id="tab-cal" class="tab"></section>
  <section id="tab-deck" class="tab"></section>
  <section id="tab-set" class="tab"></section>
</main>

<nav class="nav"><div>
  <button data-tab="today" class="on"><span class="i"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" /></svg></span>今日</button>
  <button data-tab="cal"><span class="i"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M6 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-11a1 1 0 0 1 -1 -1v-14a1 1 0 0 1 1 -1m3 0v18" /><path d="M13 8l2 0" /><path d="M13 12l2 0" /></svg></span>日記</button>
  <button data-tab="deck"><span class="i"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /><path d="M14 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /><path d="M4 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /><path d="M14 15a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -4" /></svg></span>圖鑑</button>
  <button data-tab="set"><span class="i"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg></span>設定</button>
</div></nav>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="zoom" class="zoom hidden"><img alt=""></div>
<div id="toast"></div>

<script>
/* =========================================================
   1. 牌卡資料（78 張）
   每張：關鍵字 kw、今日指引 msg、需要注意 care
   ========================================================= */
const BRAND = '依期一會｜塔羅日記';
const TAGLINE = '以牌為鏡，與每個當下的自己相遇。';
const IMG_FOOT = '以牌為鏡，與每個當下的自己相遇 ♡'; // 匯出圖片底部
const MAJOR = [
 ['the-fool','The Fool','愚者','新開始・天真・冒險','今天適合帶著好奇心出發，不用把每一步都想清楚，先跨出去就好。','衝動之前停一秒，確認重要的東西都帶在身上。'],
 ['the-magician','The Magician','魔術師','顯化・意志力・資源','你手上已經有需要的工具了，今天是把想法變成行動的好日子。','別只停在計畫，也小心說得多、做得少。'],
 ['the-high-priestess','The High Priestess','女祭司','直覺・靜默・內在智慧','今天多聽少說，答案可能在安靜的時候自己浮現。相信你的直覺。','資訊還沒完整前先觀察，不必急著表態。'],
 ['the-empress','The Empress','皇后','豐盛・滋養・美感','好好照顧自己，也享受身邊的美好。吃一頓好吃的、摸摸柔軟的東西都好。','照顧別人的同時，別忘了把自己也放進名單。'],
 ['the-emperor','The Emperor','皇帝','秩序・責任・穩定','今天適合建立規則、排好優先順序，用穩穩的步調掌握局面。','堅持原則很好，但別變得太固執或想控制一切。'],
 ['the-hierophant','The Hierophant','教皇','傳統・學習・指引','向有經驗的人請教，或回到熟悉可靠的方法，事情會更順。','別因為「大家都這樣」就忽略自己真正的想法。'],

const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>keyOf(new Date(Date.now()-DAY_START*36e5));
function nextResetMs(){const n=new Date(),r=new Date(n);r.setHours(DAY_START,0,0,0);if(r<=n)r.setDate(r.getDate()+1);return r-n;}

async function initCloud(){
  try{
    const [appM,authM,fsM]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    const app=appM.initializeApp(firebaseConfig);
    cloud.A=authM;cloud.F=fsM;cloud.auth=authM.getAuth(app);cloud.db=fsM.getFirestore(app);cloud.ready=true;cloud.status='';
    authM.getRedirectResult(cloud.auth).catch(e=>console.warn('redirect',e));
    authM.onAuthStateChanged(cloud.auth,u=>{
      cloud.user=u;
      if(u)startSync();else{if(cloud.unsub){cloud.unsub();cloud.unsub=null;}cloud.status='';refreshCloudUI();}
    });
  }catch(e){console.warn('cloud init',e);cloud.status='offline';refreshCloudUI();}
}
/* 登入：Google（瀏覽器用）＋ email／密碼（主畫面 App 用，iPhone 主畫面 App 常常跳不出 Google 視窗） */
const isStandalone=()=>!!(navigator.standalone||matchMedia('(display-mode: standalone)').matches);
const AUTH_ERR={'auth/invalid-credential':'email 或密碼不對','auth/wrong-password':'密碼不對','auth/user-not-found':'找不到這個帳號，請先在 Safari 用 Google 登入並設定密碼',
  'auth/invalid-email':'email 格式不對','auth/too-many-requests':'嘗試太多次了，請稍後再試','auth/operation-not-allowed':'Firebase 還沒開啟「電子郵件/密碼」登入',
  'auth/weak-password':'密碼至少要 6 個字','auth/network-request-failed':'網路連不上，請確認有網路','auth/provider-already-linked':'已經設定過密碼了',
  'auth/email-already-in-use':'這個 email 已經有密碼了','auth/credential-already-in-use':'這個 email 已經有密碼了'};
const authMsg=e=>AUTH_ERR[e.code]||('登入失敗（'+(e.code||e.message)+'）');
function cloudLogin(){
  if(!cloud.ready){toast('雲端還沒連上，請確認有網路');return;}

  const google=`<button class="btn ${sa?'ghost':''}" style="width:100%" onclick="googleLogin()">用 Google 帳號登入</button>`;
  const mail=`<div class="sublbl">${sa?'':'或用 '}email／密碼登入</div>
      <input class="in1" id="lgEmail" type="email" autocomplete="username" placeholder="你的 Gmail">
      <input class="in1" id="lgPw" type="password" autocomplete="current-password" placeholder="App 密碼">
      <div class="btns"><button class="btn ${sa?'':'ghost'}" onclick="emailLogin()">登入</button></div>
      <p class="hint" style="font-size:12px;margin:8px 0 0"><a href="#" onclick="resetPw();return false" style="color:var(--sub)">忘記密碼？寄重設信給我</a></p>`;
  openSheet(`<button class="close" onclick="closeSheet()">✕</button><div class="h2">☁️ 登入雲端</div>
    ${sa?`<p style="font-size:13px;color:var(--sub);margin:0 0 10px">主畫面的 App 比較常跳不出 Google 視窗，建議用 email／密碼登入。<br>還沒設定密碼的話：先用 Safari 打開網址、用 Google 登入，再到「設定」→「🔑 設定 App 密碼」。</p>${mail}<div class="sublbl" style="margin-top:16px">也可以試試</div>${google}`
      :`${google}${mail}`}`);
}
async function googleLogin(){
  const A=cloud.A,p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await A.signInWithPopup(cloud.auth,p);closeSheet();toast('☁️ 登入成功');}
  catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code)){
      try{await A.signInWithRedirect(cloud.auth,p);}catch(e2){toast('⚠️ '+authMsg(e2));}
    }else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('⚠️ '+authMsg(e));
    else if(isStandalone())toast('Google 視窗被關掉了，請改用 email／密碼登入');
  }
}
async function emailLogin(){
  const em=document.getElementById('lgEmail').value.trim(),pw=document.getElementById('lgPw').value;
  if(!em||!pw){toast('請輸入 email 和密碼');return;}
  try{await cloud.A.signInWithEmailAndPassword(cloud.auth,em,pw);closeSheet();toast('☁️ 登入成功');}
  catch(e){toast('⚠️ '+authMsg(e));}
}
async function resetPw(){
  const em=document.getElementById('lgEmail').value.trim();if(!em){toast('請先在上面輸入 email');return;}
  try{await cloud.A.sendPasswordResetEmail(cloud.auth,em);toast('📧 重設密碼的信寄出了，請收信');}catch(e){toast('⚠️ '+authMsg(e));}
}
const hasPw=()=>!!(cloud.user&&cloud.user.providerData.some(p=>p.providerId==='password'));
function pwSheet(){
  openSheet(`<button class="close" onclick="closeSheet()">✕</button><div class="h2">🔑 ${hasPw()?'變更':'設定'} App 密碼</div>
    <p style="font-size:13px;color:var(--sub);margin:0 0 10px">設定後，主畫面的 App 可以用「${esc(cloud.user.email)}」＋這組密碼登入，看到的是同一份日記。</p>
    <input class="in1" id="pw1" type="password" autocomplete="new-password" placeholder="新密碼（至少 6 個字）">
    <input class="in1" id="pw2" type="password" autocomplete="new-password" placeholder="再輸入一次">
    <div class="btns"><button class="btn" onclick="savePw()">儲存密碼</button></div>`);
}
async function savePw(again){
  const a=document.getElementById('pw1').value,b=document.getElementById('pw2').value,A=cloud.A,u=cloud.auth.currentUser;
  if(a.length<6){toast('密碼至少要 6 個字');return;}if(a!==b){toast('兩次輸入的密碼不一樣');return;}
  try{
    if(hasPw())await A.updatePassword(u,a);
    else await A.linkWithCredential(u,A.EmailAuthProvider.credential(u.email,a));
    await u.reload();cloud.user=cloud.auth.currentUser;closeSheet();toast('🔑 密碼設定好了');renderSet();
  }catch(e){
    if(e.code==='auth/requires-recent-login'&&!again){
      try{await A.reauthenticateWithPopup(u,new A.GoogleAuthProvider());return savePw(true);}catch(e2){toast('⚠️ '+authMsg(e2));return;}
    }
    toast('⚠️ '+authMsg(e));
  }
}
async function cloudLogout(){if(cloud.ready)await cloud.A.signOut(cloud.auth);toast('已登出，資料仍保留在這支手機');}

async function startSync(){
  const F=cloud.F;cloud.status='syncing';refreshCloudUI();
  try{
    // 設定
    const ss=await F.getDoc(userDoc('meta','settings'));
    const cs=ss.exists()?ss.data():null,ls=DB.settings||{};
    if(cs&&(cs.u||0)>(ls.u||0))DB.settings=cs;
    else if(Object.keys(ls).length)await F.setDoc(userDoc('meta','settings'),clean({...ls,u:ls.u||Date.now()}));
    // 每天的紀錄：雙向合併，較新的贏
    const snap=await F.getDocs(userDays());
    const remote={};snap.forEach(d=>remote[d.id]=d.data());
    for(const k in remote){const l=DB.days[k];if(!l||(remote[k].u||0)>(l.u||0))DB.days[k]=remote[k];}
    const ups=[];
    for(const k in DB.days){const l=DB.days[k],r=remote[k];
      if(!l.u)l.u=l.savedAt||l.drawnAt||Date.now();
      if(!r||l.u>(r.u||0))ups.push(F.setDoc(userDoc('days',k),clean(l)));}
    await Promise.all(ups);
    save();
    // 之後其他裝置改了，這裡會即時更新
    if(cloud.unsub)cloud.unsub();
    cloud.unsub=F.onSnapshot(userDays(),s=>{
      let ch=false;
      s.docChanges().forEach(c=>{const k=c.doc.id;
        if(c.type==='removed'){if(DB.days[k]){delete DB.days[k];ch=true;}return;}
        const r=c.doc.data(),l=DB.days[k];if(!l||(r.u||0)>(l.u||0)){DB.days[k]=r;ch=true;}});
      if(ch){save();rerenderSoft();}
    },e=>{console.warn(e);cloud.status='error';refreshCloudUI();});
    cloud.status='ok';applyBack();
  }catch(e){console.warn('sync',e);cloud.status='error';}
  refreshCloudUI();
}
function cloudPutDay(key){
  if(!cloud.user)return;const F=cloud.F,r=DB.days[key];
  const p=r?F.setDoc(userDoc('days',key),clean(r)):F.deleteDoc(userDoc('days',key));
  p.then(()=>{if(cloud.status==='error'){cloud.status='ok';refreshCloudUI();}}).catch(e=>{console.warn(e);cloud.status='error';refreshCloudUI();});
}
function cloudPutSettings(){if(!cloud.user)return;cloud.F.setDoc(userDoc('meta','settings'),clean(DB.settings||{})).catch(e=>console.warn(e));}
function commitDay(key){const r=DB.days[key];if(r)r.u=Date.now();const ok=save();cloudPutDay(key);return ok;}
function commitSettings(patch){DB.settings={...(DB.settings||{}),...patch,u:Date.now()};save();cloudPutSettings();}
function rerenderSoft(){const a=document.activeElement;if(a&&a.tagName==='TEXTAREA')return;const b=document.querySelector('.nav button.on');RENDER[b.dataset.tab]();}
function refreshCloudUI(){const b=document.querySelector('.nav button.on').dataset.tab;if(b==='set'||b==='today')rerenderSoft();}
function cloudLine(){
  if(cloud.user){
    const st={syncing:'🔄 同步中…',ok:'✅ 已同步',error:'⚠️ 同步失敗，有網路時會再試'}[cloud.status]||'';
    return `<div class="row"><div>☁️ 雲端同步<small>${esc(cloud.user.email||'')}<br>${st}</small></div><button class="btn small ghost" onclick="cloudLogout()">登出</button></div>
      <div class="row"><div>🔑 App 密碼<small>${hasPw()?'已設定，主畫面 App 可以用 email＋密碼登入':'設定後，主畫面的 App 也能登入'}</small></div><button class="btn small ${hasPw()?'ghost':''}" onclick="pwSheet()">${hasPw()?'變更':'設定'}</button></div>`;
  }
  if(cloud.status==='loading')return `<div class="row"><div>☁️ 雲端同步<small>連線中…</small></div></div>`;
  if(cloud.status==='offline')return `<div class="row"><div>☁️ 雲端同步<small>目前連不上雲端（沒有網路？）</small></div><button class="btn small ghost" onclick="location.reload()">重試</button></div>`;
  return `<div class="row"><div>☁️ 雲端同步<small>登入後，手機、電腦都能看到同一份日記</small></div><button class="btn small" onclick="cloudLogin()">登入</button></div>`;
}

let curKey=todayKey();
function countdownText(){const ms=nextResetMs(),h=Math.floor(ms/36e5),m=Math.ceil((ms%36e5)/6e4);
  return h?`${h} 小時 ${m===60?59:m} 分`:`${m} 分鐘`;}
function topBanner(){
  if(cloud.ready&&!cloud.user)return `<div class="banner">☁️<span>登入雲端，日記換手機也不怕不見</span><button class="btn small" onclick="cloudLogin()">登入</button></div>`;
  if(!cloud.user)return backupBanner();
  return '';
}
function renderToday(justDrawn){
  const el=document.getElementById('tab-today');
  const rec=DB.days[curKey];
  let h=topBanner()+`<div class="h1">今日指引</div>
    <div class="meta">${prettyDate(curKey)}</div>`;
  if(!rec){
    h+=`<div class="stage idle" id="stage"><div class="flipper" id="flipper">

    <img class="card-img" src="${img(c,0,dk)}" alt="${c.en}" onclick="zoom('${img(c,0,dk)}')" style="${arStyle(dk)}${justDrawn?';animation:fade .6s ease':''}">

    <div class="box"><div class="lbl">今日指引</div><p class="letter">${c.msg}</p></div>
    <div class="box"><div class="lbl">需要注意</div><p>${c.care}</p></div>
    <div class="btns">
      <button class="btn line" onclick="shareCard('${curKey}',this)">💬 分享到 LINE</button>
      <button class="btn ghost" onclick="saveImage('${curKey}',this)">⬇️ 儲存圖片</button>
    </div>
    <div class="box" id="intuBox"></div>
    <div class="box" id="diaryBox"></div>`;
  const [y,m,d]=curKey.split('-');const ly=`${+y-1}-${m}-${d}`;
  if(DB.days[ly]){const lc=CARDS[DB.days[ly].card];
    h+=`<div class="box lastyear" onclick="openDay('${ly}')"><img src="${img(lc,1,deckOf(DB.days[ly]))}" alt=""><div><div class="lbl">🕰️ 去年的今天</div>${cardTitle(lc)}</div></div>`;}

/* 沒登入雲端時：超過 30 天沒備份就提醒 */
function backupBanner(){
  const keys=Object.keys(DB.days).sort();if(!keys.length)return '';
  const last=(DB.settings||{}).lastExport;
  const since=last||new Date(keys[0]).getTime();
  const days=Math.floor((Date.now()-since)/864e5);
  if(days<30)return '';
  return `<div class="banner">📦<span>${last?`已經 ${days} 天沒有備份了`:'還沒備份過喔'}，記得匯出一下～</span><button class="btn small" onclick="exportData();renderToday()">匯出</button></div>`;
}
function drawCard(){
  const stage=document.getElementById('stage');
  if(stage.dataset.busy)return; stage.dataset.busy=1;
  const r=new Uint32Array(1);crypto.getRandomValues(r);
  const idx=r[0]%78,key=curKey;
  const fi=document.getElementById('frontImg');
  const go=()=>{
    stage.classList.remove('idle');
    document.getElementById('flipper').classList.add('flipped');
    document.getElementById('hint').textContent='✨';
    DB.days[key]={card:idx,deck:curDeck(),drawnAt:Date.now()};commitDay(key);
    setTimeout(()=>renderToday(true),1500);
  };
  fi.onload=go;fi.onerror=go;fi.src=img(CARDS[idx],0,curDeck());
}

/* 日記（今日頁和月曆彈窗共用）：預設是「閱讀模式」，按「新增／編輯」才會打開表單 */
function renderDiaryForm(box,key,title,editing){
  const rec=DB.days[key];
  const has=!!(rec.diary||rec.mood!=null||rec.fit);
  const savedTxt=rec.savedAt?'上次儲存：'+new Date(rec.savedAt).toLocaleString('zh-TW',{hour12:false}):'';
  if(!editing){
    box.innerHTML=`<div class="lbl">${title}</div>`+(has?`
      <div class="dview">
        <div class="dmeta">${rec.mood!=null?`<span class="dmood">${MOODS[rec.mood]}</span>`:''}
          ${rec.fit?`<span class="dstars">${'★'.repeat(rec.fit)}<i>${'★'.repeat(5-rec.fit)}</i></span><span class="fitlbl">${FITS[rec.fit]}</span>`:''}</div>
        ${rec.diary?`<p class="dtext">${esc(rec.diary)}</p>`:''}
      </div>
      <div class="btns"><button class="btn ghost" data-edit>✏️ 編輯日記</button></div>
      <div class="saved">${savedTxt}</div>`:`
      <p class="dempty">還沒有寫這天的日記</p>
      <div class="btns"><button class="btn" data-edit>＋ 新增日記</button></div>`);
    box.querySelector('[data-edit]').onclick=()=>renderDiaryForm(box,key,title,true);
    return;
  }
  const st={mood:rec.mood??null,fit:rec.fit||0};
  box.innerHTML=`<div class="lbl">${title}</div>
    <div class="sublbl" style="margin-top:0">今天的心情</div>
    <div class="moods">${MOODS.map((m,i)=>`<button class="mood${st.mood===i?' on':''}" data-i="${i}">${m}</button>`).join('')}</div>
    <div class="sublbl">今天發生了什麼？</div>
    <textarea class="in" rows="5" placeholder="寫下今天的事、心情，或跟牌意有關的小發現…">${esc(rec.diary)}</textarea>
    <div class="sublbl">跟今天的牌吻合嗎？</div>
    <div class="stars">${[1,2,3,4,5].map(n=>`<button class="star${n<=st.fit?' on':''}" data-n="${n}">★</button>`).join('')}<span class="fitlbl">${FITS[st.fit]||'點星星評分'}</span></div>
    <div class="btns"><button class="btn ghost" data-cancel>取消</button><button class="btn" data-save>儲存日記</button></div>`;

const SERIF='"Noto Serif TC","Songti TC",serif';
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src;});}
function wrap(ctx,text,maxW){
  const lines=[];let line='';
  for(const ch of text){
    const t=line+ch;
    if(ctx.measureText(t).width>maxW && line && !'，。！？、」）…'.includes(ch)){lines.push(line);line=ch;}
    else line=t;
  }
  if(line)lines.push(line);return lines;
}
function drawCover(x,im,dx,dy,dw,dh){ // 像 CSS object-fit: cover
  const s=Math.max(dw/im.width,dh/im.height),sw=dw/s,sh=dh/s;
  x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,dx,dy,dw,dh);
}
function finishCanvas(cv,W,y){
  const FH=Math.round(y),out=document.createElement('canvas');out.width=W;out.height=FH;
  const o=out.getContext('2d');o.drawImage(cv,0,0);
  o.strokeStyle='#e3d9c8';o.lineWidth=3;o.strokeRect(36,36,W-72,FH-72);
  return new Promise((ok,no)=>out.toBlob(b=>b?ok(b):no(new Error('blob')),'image/png'));
}
async function makeShareBlob(key){
  const rec=DB.days[key],c=CARDS[rec.card];
  const S=SERIF;
  try{await Promise.all([document.fonts.load(`700 80px ${S}`,'今日指引'+prettyDate(key)+c.zh),document.fonts.load(`500 40px ${S}`,c.msg+c.care+c.kw+'依期一會'+IMG_FOOT)]);}catch(e){}
  const W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  x.fillStyle='#f6f2ea';x.fillRect(0,0,W,H);
  x.textAlign='center';x.textBaseline='alphabetic';
  x.fillStyle='#3c4a3e';x.font=`700 84px ${S}`;x.fillText('今日指引',W/2,170);
  x.fillStyle='#8a8478';x.font=`500 38px ${S}`;x.fillText(prettyDate(key),W/2,245);
  const dk=deckOf(rec),im=await loadImg(img(c,0,dk));
  const ch=840,cw=Math.round(ch*DECKS[dk].ratio),cx=(W-cw)/2,cy=320,r=26;
  x.save();x.shadowColor='rgba(80,70,50,.25)';x.shadowBlur=40;x.shadowOffsetY=16;
  x.fillStyle='#fff';x.beginPath();x.roundRect(cx,cy,cw,ch,r);x.fill();x.restore();
  x.save();x.beginPath();x.roundRect(cx,cy,cw,ch,r);x.clip();drawCover(x,im,cx,cy,cw,ch);x.restore();
  let y=cy+ch+90;
  x.fillStyle='#3c4a3e';x.font=`700 54px ${S}`;x.fillText(cardTitle(c),W/2,y);
  y+=56;x.fillStyle='#8a8478';x.font=`500 30px ${S}`;x.fillText(c.en.toUpperCase().split('').join(' '),W/2,y);
  y+=58;x.fillStyle='#a8905e';x.font=`500 34px ${S}`;x.fillText(c.kw.split('・').join('  ·  '),W/2,y);
  y+=40;x.strokeStyle='#d9ccb6';x.lineWidth=2;x.beginPath();x.moveTo(W/2-120,y);x.lineTo(W/2+120,y);x.stroke();
  x.fillStyle='#3c4a3e';x.font=`500 42px ${S}`;
  y+=74;for(const l of wrap(x,c.msg,860)){x.fillText(l,W/2,y);y+=66;}
  x.fillStyle='#8a8478';x.font=`500 34px ${S}`;
  y+=14;for(const l of wrap(x,'需要注意：'+c.care,860)){x.fillText(l,W/2,y);y+=54;}
  y+=46;x.fillStyle='#b9ab92';x.font=`500 26px ${S}`;x.fillText('依期一會｜'+IMG_FOOT,W/2,y);
  return finishCanvas(cv,W,Math.min(H,y+70));
}
async function makeMonthBlob(Y,M){
  const S=SERIF,W=1080,cv=document.createElement('canvas');cv.width=W;cv.height=2600;
  const x=cv.getContext('2d');
  try{await document.fonts.load(`700 72px ${S}`,BRAND+IMG_FOOT+'年月抽牌天數寫日記平均吻合心情本月最常抽到日一二三四五六');}catch(e){}
  x.fillStyle='#f6f2ea';x.fillRect(0,0,W,cv.height);x.textAlign='center';
    x.fillStyle='#3c4a3e';x.font=`700 76px ${S}`;x.fillText(`${Y} 年 ${M+1} 月`,W/2,170);
  // 月曆
  const first=new Date(Y,M,1).getDay(),days=new Date(Y,M+1,0).getDate(),rows=Math.ceil((first+days)/7);
  const gap=12,cw=(W-120-gap*6)/7,ch=cw*1.5,gx=60,gy=260;
  x.font=`500 26px ${S}`;x.fillStyle='#8a8478';
  [...WD].forEach((w,i)=>x.fillText(w,gx+i*(cw+gap)+cw/2,gy-14));
  const keys=[];for(let d=1;d<=days;d++)keys.push(`${Y}-${pad(M+1)}-${pad(d)}`);
  const imgs={};await Promise.all(keys.filter(k=>DB.days[k]).map(async k=>{const r=DB.days[k];try{imgs[k]=await loadImg(img(CARDS[r.card],1,deckOf(r)));}catch(e){}}));
  let drawn=0,wrote=0,fs=0,fn=0;const cardCnt={},moodCnt={};
  keys.forEach((k,i)=>{
    const p=first+i,cx=gx+(p%7)*(cw+gap),cy=gy+Math.floor(p/7)*(ch+gap),r=DB.days[k];
    x.save();x.beginPath();x.roundRect(cx,cy,cw,ch,12);x.fillStyle='#fffdf8';x.fill();x.strokeStyle='#e8e0d2';x.lineWidth=2;x.stroke();x.clip();
    if(r&&imgs[k])drawCover(x,imgs[k],cx,cy,cw,ch);
    x.restore();
    // 日期
    x.textAlign='left';x.font=`600 22px ${S}`;
    if(r){x.fillStyle='rgba(255,253,248,.92)';x.beginPath();x.roundRect(cx+5,cy+5,i>=9?40:30,28,8);x.fill();}
    x.fillStyle=r?'#3c4a3e':'#b4ab9c';x.fillText(String(i+1),cx+11,cy+27);
    if(r){
      drawn++;if(r.diary)wrote++;if(r.fit){fs+=r.fit;fn++;}
      const ck=deckOf(r)+':'+r.card;cardCnt[ck]=(cardCnt[ck]||0)+1;
      if(r.mood!=null){moodCnt[r.mood]=(moodCnt[r.mood]||0)+1;
        x.fillStyle='rgba(255,253,248,.92)';x.beginPath();x.arc(cx+cw-22,cy+ch-22,19,0,7);x.fill();
        x.textAlign='center';x.font=`26px ${EMOJI}`;x.fillText(MOODS[r.mood],cx+cw-22,cy+ch-12);}
    }
  });
  let y=gy+rows*(ch+gap)+24;
  // 統計
  const topMood=Object.keys(moodCnt).sort((a,b)=>moodCnt[b]-moodCnt[a])[0];
  const stats=[[String(drawn),'抽牌天數'],[String(wrote),'寫日記天數'],[fn?(fs/fn).toFixed(1)+' ★':'–','平均吻合'],[topMood!=null?MOODS[topMood]:'–','最多的心情']];
  const sw=(W-120-16*3)/4;
  stats.forEach(([v,l],i)=>{const sx=60+i*(sw+16);
    x.fillStyle='#fffdf8';x.strokeStyle='#e8e0d2';x.lineWidth=2;x.beginPath();x.roundRect(sx,y,sw,130,18);x.fill();x.stroke();
    x.textAlign='center';x.fillStyle='#3c4a3e';x.font=i===3?`46px ${EMOJI}`:`700 44px ${S}`;x.fillText(v,sx+sw/2,y+66);
    x.fillStyle='#8a8478';x.font=`500 24px ${S}`;x.fillText(l,sx+sw/2,y+106);});
  y+=130+20;
  // 最常抽到
  const top=Object.keys(cardCnt).sort((a,b)=>cardCnt[b]-cardCnt[a])[0];
  if(top){
    const [tdk,tid]=top.split(':'),tc=CARDS[+tid];
    x.fillStyle='#fffdf8';x.strokeStyle='#e8e0d2';x.beginPath();x.roundRect(60,y,W-120,210,18);x.fill();x.stroke();
    try{const ti=await loadImg(img(tc,1,tdk));x.save();x.beginPath();x.roundRect(90,y+20,113,170,10);x.clip();drawCover(x,ti,90,y+20,113,170);x.restore();}catch(e){}
    x.textAlign='left';x.fillStyle='#a8905e';x.font=`600 26px ${S}`;x.fillText('本月最常抽到',236,y+64);
    x.fillStyle='#3c4a3e';x.font=`700 46px ${S}`;x.fillText(`${cardTitle(tc)}  ×${cardCnt[top]}`,236,y+122);
    x.fillStyle='#8a8478';x.font=`500 26px ${S}`;x.fillText(tc.kw.split('・').join(' · '),236,y+164);
    y+=210;
  }
  y+=62;x.textAlign='center';x.fillStyle='#b9ab92';x.font=`500 26px ${S}`;x.fillText('依期一會｜'+IMG_FOOT,W/2,y);
  return finishCanvas(cv,W,y+66);
}
function shareText(key){const c=CARDS[DB.days[key].card];
  return `🃏 今日指引 ${key}\n${cardTitle(c)}｜${c.en}\n${c.msg}`;}
async function shareBlob(blob,name,text,title){
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title,text});return;}
    catch(e){if(e.name==='AbortError')return;}
  }
  showSharePreview(blob,name,text);
}
async function withBusy(btn,fn){const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='製作中…';
  try{await fn();}catch(e){console.warn(e);toast('⚠️ 圖片做不出來，請用 GitHub Pages 網址開啟');}
  btn.disabled=false;btn.innerHTML=old;}

function saveImage(key,btn){withBusy(btn,async()=>showSharePreview(await makeShareBlob(key),`tarot-${key}.png`,shareText(key)));}
function monthImage(btn){withBusy(btn,async()=>{const b=await makeMonthBlob(calY,calM);

function showSharePreview(blob,name,text){

      <a class="btn ghost" href="${url}" download="${name}" style="text-decoration:none">⬇️ 下載圖片</a>
      <a class="btn line" href="https://line.me/R/share?text=${encodeURIComponent(text)}" target="_blank" style="text-decoration:none">💬 LINE 傳文字</a>
    </div>`);
}

      <p style="font-size:13px;color:var(--sub)">🌅 每天清晨 ${DAY_START}:00 換日，半夜寫日記還是算「今天」。<br>☁️ 登入 Google 後，資料會同步到雲端；沒網路時先存在手機，有網路再自動上傳。<br>📱 加到主畫面：Safari 分享 →「加入主畫面」。</p>
    </div>
    <p class="hint" style="margin-top:18px">${BRAND}<br><small>${TAGLINE}</small><br><small style="opacity:.7">v2.0・傳統偉特塔羅：Pamela Colman Smith 1909（公有領域）</small></p>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`依期一會-備份-${todayKey()}.json`;
  document.body.appendChild(a);a.click();a.remove();commitSettings({lastExport:Date.now()});toast('📦 備份已下載');
}
function importData(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.days)throw 0;
      let n=0;for(const k in d.days){if(typeof d.days[k].card==='number'){DB.days[k]={...DB.days[k],...d.days[k]};commitDay(k);n++;}}
      toast(`📥 已匯入 ${n} 天`);renderAll();}
    catch(e){toast('⚠️ 這不是正確的備份檔');}
    input.value='';};
  rd.readAsText(f);
}
function clearAll(btn){
  if(!btn.dataset.sure){btn.dataset.sure=1;btn.textContent='再按一次確認';btn.style.color='#b55';setTimeout(()=>{delete btn.dataset.sure;btn.textContent='清除';btn.style.color='';},3000);return;}
  const keys=Object.keys(DB.days);DB.days={};save();keys.forEach(cloudPutDay);toast('已清除');renderAll();
}

/* =========================================================
   9. 共用：彈窗、放大、分頁切換、換日
   ========================================================= */
function openSheet(html){const m=document.getElementById('modal');document.getElementById('sheet').innerHTML=html;m.classList.remove('hidden');document.getElementById('sheet').scrollTop=0;}
function closeSheet(){document.getElementById('modal').classList.add('hidden');}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeSheet();};
function zoom(src){const z=document.getElementById('zoom');z.querySelector('img').src=src;z.classList.remove('hidden');}
document.getElementById('zoom').onclick=()=>document.getElementById('zoom').classList.add('hidden');

const RENDER={today:()=>renderToday(),cal:renderCal,deck:renderDeck,set:renderSet};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id==='tab-'+b.dataset.tab));
  RENDER[b.dataset.tab]();window.scrollTo(0,0);
});
function renderAll(){renderToday();renderCal();renderDeck();renderSet();}

// 每 30 秒更新倒數；過了清晨換日時間就換成新的一天
function tick(){
  if(todayKey()!==curKey){curKey=todayKey();const a=document.activeElement;if(!(a&&a.tagName==='TEXTAREA'))renderToday();return;}
  const cd=document.getElementById('cd');if(cd)cd.textContent=countdownText();
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});

load();applyBack();renderToday();initCloud();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
